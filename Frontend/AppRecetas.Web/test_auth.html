<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Auth - Saboritm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
    <h3>Prueba de Autenticación</h3>
    <button id="btnCheck" class="btn btn-primary">Verificar Token</button>
    <div id="result" class="mt-4 alert d-none"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.42.0/dist/umd/supabase.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.getElementById('btnCheck').onclick = async () => {
            const resDiv = document.getElementById('result');
            resDiv.classList.remove('d-none', 'alert-success', 'alert-danger');
            resDiv.textContent = "Verificando...";

            try {
                const client = getSupabase();
                const { data: { session } } = await client.auth.getSession();
                
                if (!session) {
                    resDiv.classList.add('alert-danger');
                    resDiv.textContent = "No hay sesión activa en el navegador. Por favor, ve a login.html e inicia sesión de nuevo.";
                    return;
                }

                const token = session.access_token;
                console.log("Token encontrado:", token);

                const response = await fetch(`${API_BASE_URL}/recetas`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    resDiv.classList.add('alert-success');
                    resDiv.textContent = "¡Éxito! El servidor reconoce tu sesión correctamente.";
                } else {
                    const errorText = await response.text();
                    resDiv.classList.add('alert-danger');
                    resDiv.textContent = `Error ${response.status}: El servidor rechazó el token. Detalles: ${errorText}`;
                }
            } catch (err) {
                resDiv.classList.add('alert-danger');
                resDiv.textContent = "Error de conexión: " + err.message;
            }
        };
    </script>
</body>
</html>
