    <!-- Script para marcar el link activo y estilos extra -->
    <style>
        .hover-bg-light { transition: background-color 0.2s, color 0.2s; }
        .hover-bg-light:hover { background-color: #f8f9fa; color: #198754 !important; }
        .nav-link.active-link { 
            background-color: #e8f5e9; 
            color: #198754 !important; 
            font-weight: 700; 
        }
        .dropdown-item.active-link {
            background-color: #e8f5e9;
            color: #198754 !important;
            font-weight: 700;
        }
        .pulse-btn:hover {
            transform: scale(1.05);
            transition: transform 0.2s;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Navbar scroll effect
            window.addEventListener('scroll', () => {
                const nav = document.querySelector('.navbar-custom');
                if (window.scrollY > 50) {
                    nav.classList.add('scrolled');
                } else {
                    nav.classList.remove('scrolled');
                }
            });

            // Lógica para asignar la clase active-link automáticamente
            const currentPath = window.location.pathname.split("/").pop() || "index.html";
            const navLinks = document.querySelectorAll(".nav-link-custom, .dropdown-item");
            
            navLinks.forEach(link => {
                const href = link.getAttribute("href");
                if (href === currentPath) {
                    link.classList.add("active");
                }
            });
        });
    </script>
    <!-- Fin Navbar Personalizado -->

    <div class="admin-header py-4 bg-white border-bottom mb-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
            <div class="text-center text-md-start">
                <h1 class="h2 fw-bold text-dark mb-1">Categorías</h1>
                <p class="text-muted mb-0">Organiza tus recetas por tipos y estilos</p>
            </div>
            <button class="btn btn-premium btn-premium-success shadow-sm" data-bs-toggle="modal" data-bs-target="#categoriaModal">
                <i class="bi bi-plus-circle"></i> <span>Nueva Categoría</span>
            </button>
        </div>
    </div>

    <div class="container mb-5 animate-fade-in">
        <div class="card card-premium overflow-hidden border-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4 py-3 text-secondary small fw-bold text-uppercase" style="letter-spacing: 0.05em">Nombre de Categoría</th>
                            <th class="text-end pe-4 py-3 text-secondary small fw-bold text-uppercase" style="letter-spacing: 0.05em">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="categorias-tbody" class="border-top-0">
                        <tr><td colspan="2" class="text-center text-muted py-5">
                            <div class="spinner-border text-success spinner-border-sm me-2" role="status"></div>
                            Cargando categorías...
                        </td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Nuevo/Editar Categoría -->
    <div class="modal fade" id="categoriaModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="categoriaForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Guardar Categoría</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" for="nombreCategoria">Nombre</label>
                            <input type="text" class="form-control" id="nombreCategoria" name="nombre" placeholder="Ej: Bebidas" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tbody = document.getElementById('categorias-tbody');
            const form = document.getElementById('categoriaForm');
            const modalEl = document.getElementById('categoriaModal');
            let bootstrapModal = null;
            if(window.bootstrap) bootstrapModal = new bootstrap.Modal(modalEl);

            const cargarCategorias = async () => {
                const categorias = await api.get('/categorias');
                tbody.innerHTML = '';
                if (!categorias || categorias.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="2" class="text-center py-4">No hay categorías registradas.</td></tr>';
                    return;
                }
                
                categorias.forEach(cat => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="ps-4 align-middle">${cat.nombre}</td>
                            <td class="text-end pe-4 align-middle">
                                <button class="btn btn-sm btn-outline-danger btn-delete" data-id="${cat.idCategoria}">Eliminar</button>
                            </td>
                        </tr>
                    `;
                });

                document.querySelectorAll('.btn-delete').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const result = await Swal.fire({
                            title: '¿Estás seguro?',
                            text: "Se eliminarán las referencias en las recetas.",
                            icon: 'warning',
                            showCancelButton: true,
                            confirmButtonColor: '#198754',
                            cancelButtonColor: '#d33',
                            confirmButtonText: 'Sí, eliminar',
                            cancelButtonText: 'Cancelar'
                        });

                        if (result.isConfirmed) {
                            const id = parseInt(e.target.getAttribute('data-id'));
                            const success = await api.delete(`/categorias/${id}`);
                            if (success) {
                                Swal.fire({ title: '¡Eliminado!', icon: 'success', timer: 1000, showConfirmButton: false });
                                cargarCategorias();
                            }
                        }
                    });
                });
            };

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const nombre = document.getElementById('nombreCategoria').value;
                if(nombre) {
                    const res = await api.post('/categorias', { nombre });
                    if (res) {
                        Swal.fire({ title: '¡Guardado!', icon: 'success', timer: 1000, showConfirmButton: false });
                        form.reset();
                        if(bootstrapModal) bootstrapModal.hide();
                        cargarCategorias();
                    }
                }
            });

            await cargarCategorias();
        });
    </script>
</body>
