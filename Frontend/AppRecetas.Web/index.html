    <main class="container mb-5">
        <!-- Search & Filter Area -->

            <div class="card card-premium shadow-xl p-3 p-md-4 mb-5 border-0">

                        </div>
                    </div>
                    <div class="col-6 col-lg-4">
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 ps-3"><i class="bi bi-tag text-success"></i></span>
                            <select id="filtroCategoria" class="form-select form-control-premium border-start-0">

                            </select>
                        </div>
                    </div>
                    <div class="col-6 col-lg-3">
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 ps-3"><i class="bi bi-clock text-success"></i></span>
                            <select id="filtroTiempo" class="form-select form-control-premium border-start-0">
                                <option value="">Cualquier Tiempo</option>
                                <option value="15">Rápido (15 min)</option>
                                <option value="30">Medio (30 min)</option>

                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recipe Grid -->
        <div class="row g-4" id="contenedor-recetas">
            <!-- Loading State -->
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-success" role="status"></div>
                <p class="text-muted mt-3">Preparando delicias...</p>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.42.0/dist/umd/supabase.js"></script>
    <script src="js/api.js"></script>
    <script>
        let todasLasRecetas = [];
        const DEFAULT_NO_FOOD = 'assets/no-food.png';

        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const nav = document.querySelector('.navbar-custom');
            if (window.scrollY > 50) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        });

        async function inicializarPagina() {
            try {
                // Cargar Categorías
                const respCat = await fetch(`${API_BASE_URL}/categorias`);
                if (respCat.ok) {
                    const categorias = await respCat.json();
                    const selectCat = document.getElementById('filtroCategoria');
                    categorias.forEach(cat => {
                        selectCat.innerHTML += `<option value="${cat.idCategoria}">${cat.nombre}</option>`;
                    });
                }

                // Cargar Recetas
                const response = await fetch(`${API_BASE_URL}/recetas`);
                if (!response.ok) throw new Error('Error en la petición');
                todasLasRecetas = await response.json();

                renderizarRecetas(todasLasRecetas);

                document.getElementById('filtroNombre').addEventListener('input', aplicarFiltros);
                document.getElementById('filtroCategoria').addEventListener('change', aplicarFiltros);
                document.getElementById('filtroTiempo').addEventListener('change', aplicarFiltros);

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('contenedor-recetas').innerHTML = '<div class="col-12 text-center py-5 text-danger"><h5>Error cargando datos.</h5></div>';
            }
        }

        function aplicarFiltros() {
            const texto = normalizarTexto(document.getElementById('filtroNombre').value);
            const idCat = document.getElementById('filtroCategoria').value;
            const tiempoMax = document.getElementById('filtroTiempo').value;

            const filtradas = todasLasRecetas.filter(r => {
                const nombreNorm = normalizarTexto(r.nombre);
                const matchNombre = nombreNorm.includes(texto);
                const matchCat = idCat === "" || r.idCategoria == idCat;
                const matchTiempo = tiempoMax === "" || (r.tiempoPreparacion || 30) <= parseInt(tiempoMax);
                return matchNombre && matchCat && matchTiempo;
            });

            renderizarRecetas(filtradas);
        }

        function renderizarRecetas(recetas) {
            const contenedor = document.getElementById('contenedor-recetas');
            contenedor.innerHTML = '';

            if (recetas.length === 0) {
                contenedor.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="bi bi-search display-1 text-muted opacity-25"></i>
                        <h5 class="text-muted mt-3">No se encontraron recetas que coincidan.</h5>
                    </div>`;
                return;
            }

            recetas.forEach((r, index) => {
                const img = resolveImgUrl(r.imagenUrl) || DEFAULT_NO_FOOD;
                const tiempo = r.tiempoPreparacion ? `${r.tiempoPreparacion} min` : '30 min';
                const id = r.idReceta || r.id;
                const cat = r.categoria ? r.categoria.nombre : 'General';
                const delay = (index % 6) * 0.1;

                contenedor.innerHTML += `
                    <div class="col-12 col-md-6 col-lg-4 animate-fade-in" style="animation-delay: ${delay}s">
                        <div class="card card-premium">
                            <div class="card-img-container">
                                <span class="recipe-badge position-absolute top-0 end-0 m-3 z-3">
                                    <i class="bi bi-tag-fill text-success me-1"></i> ${cat}
                                </span>
                                <a href="receta_detalle.html?id=${id}">
                                    <img src="${img}" class="card-img-top" alt="${r.nombre}" style="height: 240px; object-fit: cover;">
                                </a>
                            </div>
                            <div class="card-body p-4 d-flex flex-column">
                                <h5 class="card-title fw-bold mb-2 text-dark">${r.nombre}</h5>
                                <div class="d-flex align-items-center gap-3 text-muted small mb-4">
                                    <span class="d-flex align-items-center gap-1">
                                        <i class="bi bi-clock text-success"></i> ${tiempo}
                                    </span>
                                    <span class="d-flex align-items-center gap-1">
                                        <i class="bi bi-journal-text text-success"></i> ${r.instrucciones ? 'Pasos' : 'Receta'}
                                    </span>
                                </div>
                                <div class="mt-auto">
                                    <a href="receta_detalle.html?id=${id}" class="btn btn-premium btn-premium-success w-100 justify-content-center">
                                        Ver Detalles <i class="bi bi-arrow-right"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        document.addEventListener('DOMContentLoaded', inicializarPagina);
    </script>
