<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Saboritm</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='14' fill='%23D6A23B' /%3E%3Cpath fill='none' stroke='%23D6A23B' stroke-width='2' stroke-linejoin='round' stroke-linecap='round' d='M 42.5 20 C 57.5 10, 77.5 20, 77.5 35 C 92.5 45, 87.5 70, 72.5 75 C 62.5 90, 32.5 90, 22.5 75 C 7.5 70, 7.5 45, 17.5 35 C 17.5 20, 37.5 10, 42.5 20 Z' /%3E%3Cpath fill='none' stroke='%23D6A23B' stroke-width='2.3' stroke-linejoin='round' stroke-linecap='round' d='M 42.5 20 C 57.5 10, 77.5 20, 77.5 35 C 92.5 45, 87.5 70, 72.5 75 C 62.5 90, 32.5 90, 22.5 75 C 7.5 70, 7.5 45, 17.5 35 C 17.5 20, 37.5 10, 42.5 20 Z' transform='translate(50,50) scale(0.86) translate(-50,-50)' /%3E%3C/svg%3E">
    <meta name="theme-color" content="#198754">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .hover-success:hover {
            color: #198754 !important;
            text-decoration: underline !important;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container d-flex align-items-center justify-content-center min-vh-100 p-3">
        <div class="card card-premium p-4 p-md-5 w-100 shadow-xl" style="max-width: 440px;">
            <div class="text-center mb-4">
                <a href="index.html" class="text-decoration-none d-flex align-items-center justify-content-center gap-2 mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="48" height="48" style="overflow: visible;">
                        <circle cx="50" cy="50" r="14" fill="#D6A23B" />
                        <path fill="none" stroke="#D6A23B" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M 42.5 20 C 57.5 10, 77.5 20, 77.5 35 C 92.5 45, 87.5 70, 72.5 75 C 62.5 90, 32.5 90, 22.5 75 C 7.5 70, 7.5 45, 17.5 35 C 17.5 20, 37.5 10, 42.5 20 Z" />
                        <path fill="none" stroke="#D6A23B" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" d="M 42.5 20 C 57.5 10, 77.5 20, 77.5 35 C 92.5 45, 87.5 70, 72.5 75 C 62.5 90, 32.5 90, 22.5 75 C 7.5 70, 7.5 45, 17.5 35 C 17.5 20, 37.5 10, 42.5 20 Z" transform="translate(50,50) scale(0.86) translate(-50,-50)" />
                    </svg>
                    <span class="fs-2" style="letter-spacing: -0.5px;">
                        <span style="color: #198754; font-weight: 700;">Sabor</span><span style="color: #212529; font-weight: 400;">itm</span>
                    </span>
                </a>
                <p class="text-muted">Acceso seguro para administradores</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label fw-600 small">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control form-control-premium" placeholder="admin@saboritm.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-600 small">Contraseña</label>
                    <input type="password" id="password" class="form-control form-control-premium" placeholder="••••••••" required>
                </div>
                <div id="errorMsg" class="alert alert-danger d-none animate-fade-in small py-2 mb-3"></div>
                <button type="submit" id="btnLogin" class="btn btn-premium btn-premium-success w-100 justify-content-center py-3 shadow-sm">
                    <span id="spinner" class="spinner-border spinner-border-sm d-none me-2"></span> 
                    <span>Iniciar Sesión</span>
                </button>
            </form>
            
            <div class="text-center mt-5">
                <a href="index.html" class="text-muted text-decoration-none small d-inline-flex align-items-center gap-1 opacity-75 hover-opacity-100 transition-base">
                    <i class="bi bi-house-door"></i> Volver al Inicio
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts: La librería de Supabase PRIMERO, luego api.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.42.0/dist/umd/supabase.js"></script>
    <script src="js/api.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const btnLogin = document.getElementById('btnLogin');
        const spinner = document.getElementById('spinner');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Limpiar UI
            errorMsg.classList.add('d-none');
            btnLogin.disabled = true;
            spinner.classList.remove('d-none');

            try {
                // Obtenemos el cliente inicializado de api.js
                const client = getSupabase();
                if (!client) throw new Error("No se pudo conectar con Supabase. Verifica el CDN.");

                const { data, error } = await client.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;

                console.info("[AUDIT] Intento de login exitoso.");
                // Supabase guarda el token automáticamente en el LocalStorage
                window.location.href = 'index.html';
            } catch (err) {
                console.warn("[AUDIT] Autenticación fallida o bloqueada.");
                errorMsg.textContent = "Error: Las credenciales proporcionadas son incorrectas o el acceso está restringido.";
                errorMsg.classList.remove('d-none');
                btnLogin.disabled = false;
                spinner.classList.add('d-none');
            }
        });

        // Revisar si ya hay sesión activa para redirigir
        async function checkAlreadyLogged() {
            const client = getSupabase();
            if (client) {
                const { data: { session } } = await client.auth.getSession();
                if (session) window.location.href = 'index.html';
            }
        }
        checkAlreadyLogged();
    </script>
</body>
</html>
