    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }

        .recipe-hero {
            position: relative;
            height: 40vh;
            min-height: 300px;
            overflow: hidden;
            border-radius: 0 0 40px 40px;
        }

        .recipe-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .recipe-hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.5), transparent);
        }

        .floating-back {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .ingredient-card {
            border-left: 4px solid var(--primary-color);
        }

        .ingredient-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 4px solid #198754 !important;
            background: #ffffff;
        }

        .ingredient-item:hover {
            transform: translateX(8px);
            background: #f8fffb;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05) !important;
        }

        .ingredient-name {
            font-size: 1.15rem;
            color: #1e293b;
            font-weight: 600;
        }

        .ingredient-amount {
            font-size: 0.95rem;
            font-weight: 500;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .ingredient-name {
                font-size: 1rem;
            }
            .ingredient-amount {
                font-size: 0.85rem;
            }
            .display-4 {
                font-size: 2.5rem;
            }
            .step-text {
                font-size: 1rem !important;
            }
            .recipe-hero {
                height: 30vh;
                min-height: 200px;
            }
        }
    </style>
</head>

<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top navbar-custom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="34" height="34" style="overflow: visible;">
                    <circle cx="50" cy="50" r="14" fill="#D6A23B" />
                    <path fill="none" stroke="#D6A23B" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M 42.5 20 C 57.5 10, 77.5 20, 77.5 35 C 92.5 45, 87.5 70, 72.5 75 C 62.5 90, 32.5 90, 22.5 75 C 7.5 70, 7.5 45, 17.5 35 C 17.5 20, 37.5 10, 42.5 20 Z" />
                    <path fill="none" stroke="#D6A23B" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" d="M 42.5 20 C 57.5 10, 77.5 20, 77.5 35 C 92.5 45, 87.5 70, 72.5 75 C 62.5 90, 32.5 90, 22.5 75 C 7.5 70, 7.5 45, 17.5 35 C 17.5 20, 37.5 10, 42.5 20 Z" transform="translate(50,50) scale(0.86) translate(-50,-50)" />
                </svg>
                <span class="fs-4" style="letter-spacing: -0.5px;">
                    <span style="color: #198754; font-weight: 700;">Sabor</span><span style="color: #212529; font-weight: 400;">itm</span>
                </span>
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2">
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle nav-link-custom" href="#" role="button"
                            data-bs-toggle="dropdown">
                            Catálogos
                        </a>
                        <ul class="dropdown-menu border-0 shadow-lg rounded-4 p-2">
                            <li><a class="dropdown-item py-2 px-3 rounded-3" href="recetas.html"><i
                                        class="bi bi-book me-2"></i>Recetas</a></li>
                            <li><a class="dropdown-item py-2 px-3 rounded-3" href="categorias.html"><i
                                        class="bi bi-tags me-2"></i>Categorías</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item py-2 px-3 rounded-3" href="ingredientes.html"><i
                                        class="bi bi-basket me-2"></i>Ingredientes</a></li>
                        </ul>
                    </li>
                </ul>
                <div
                    class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-3 mt-3 mt-lg-0 pb-3 pb-lg-0">
                    <a href="sugerencias_cocina.html"
                        class="btn btn-premium btn-premium-success shadow justify-content-center">
                        <i class="bi bi-magic fs-5"></i> <span>¿Qué cocino hoy?</span>
                    </a>
                    <button id="btn-auth-session"
                        class="btn btn-outline-success border-2 rounded-pill px-4 py-2 d-flex align-items-center justify-content-center gap-2"
                        title="Admin">
                        <i class="bi bi-person-fill fs-4"></i> Admin
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div id="receta-detalle-container">
        <!-- Loader -->
        <div class="container my-5 text-center">
            <div class="spinner-border text-success" role="status"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        const DEFAULT_NO_FOOD = 'assets/no-food.png';

        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const nav = document.querySelector('.navbar-custom');
            if (window.scrollY > 50) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        });

        async function cargarDetalle() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            const container = document.getElementById('receta-detalle-container');

            if (!id) {
                container.innerHTML = '<div class="container my-5 alert alert-warning">ID no válido.</div>';
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/recetas/${id}`);
                if (!response.ok) throw new Error('Carga fallida');
                const r = await response.json();

                const img = resolveImgUrl(r.imagenUrl) || DEFAULT_NO_FOOD;
                const cat = r.categoria ? r.categoria.nombre : 'General';

                container.innerHTML = `
                    <div class="recipe-hero animate-fade-in">
                        <a href="index.html" class="btn btn-light rounded-pill floating-back shadow-lg px-3 py-2 d-flex align-items-center gap-2">
                            <i class="bi bi-arrow-left"></i> <span class="d-none d-md-inline">Volver</span>
                        </a>
                        <img src="${img}" alt="${r.nombre}">
                    </div>

                    <div class="container" style="margin-top: -60px; position: relative; z-index: 20;">
                        <div class="card card-premium shadow-xl p-4 p-md-5 mb-5 border-0">
                            <div class="row">
                                <div class="col-12 col-md-8">
                                    <div class="mb-4">
                                        <span class="recipe-badge mb-3 d-inline-block">
                                            <i class="bi bi-tag-fill text-success me-1"></i> ${cat}
                                        </span>
                                        <h1 class="display-4 fw-bold text-dark mb-2">${r.nombre}</h1>
                                        <div class="d-flex align-items-center gap-4 text-muted">
                                            <span class="d-flex align-items-center gap-2">
                                                <i class="bi bi-clock text-success fs-5"></i> 
                                                <span class="fw-600">${r.tiempoPreparacion || 30} minutos</span>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-12 col-md-4 text-md-end mt-3 mt-md-0">
                                    <a href="receta_registro.html?id=${r.idReceta}" class="btn btn-premium btn-premium-outline solo-admin d-none px-4">
                                        <i class="bi bi-pencil-square"></i> Editar Receta
                                    </a>
                                </div>
                            </div>

                            <hr class="my-5 opacity-10">

                            <div class="row g-5">
                                <div class="col-lg-4">
                                    <div class="p-4 bg-light rounded-4 border">
                                        <h4 class="fw-bold mb-4 d-flex align-items-center gap-2">
                                            <i class="bi bi-basket text-success"></i> Ingredientes
                                        </h4>
                                        <div class="ingredients-list d-flex flex-column gap-2">
                                            ${r.recetaIngredientes.map(i => `
                                                <div class="ingredient-item p-3 bg-white rounded-3 shadow-sm d-flex justify-content-between align-items-center">
                                                    <span class="ingredient-name">${i.nombre}</span>
                                                    <span class="badge bg-success-subtle text-success rounded-pill px-3 py-2 ingredient-amount">${i.cantidad}</span>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-8">
                                    <h4 class="fw-bold mb-4 d-flex align-items-center gap-2">
                                        <i class="bi bi-list-check text-success"></i> Preparación Paso a Paso
                                    </h4>
                                    <div class="steps-container">
                                        ${r.instrucciones.split('\n').filter(s => s.trim().length > 0).map((step, idx) => `
                                            <div class="d-flex gap-4 mb-5 step-card animate-fade-in" style="animation-delay: ${idx * 0.15}s">
                                                <div class="step-number bg-success text-white d-flex align-items-center justify-content-center flex-shrink-0 shadow-sm" 
                                                     style="width: 40px; height: 40px; border-radius: 12px; font-weight: 700; font-size: 1.1rem;">
                                                    ${idx + 1}
                                                </div>
                                                <div class="step-text pt-2 lh-lg" style="font-size: 1.1rem; color: #334155;">
                                                    ${step}
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                document.title = `${r.nombre} - Saboritm`;
                
                if (typeof actualizarInterfazAuth === 'function') {
                    actualizarInterfazAuth();
                }
            } catch (error) {
                container.innerHTML = '<div class="container my-5 alert alert-danger">Error cargando receta.</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', cargarDetalle);
    </script>
</body>

</html>
