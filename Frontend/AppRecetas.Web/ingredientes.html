<body class="bg-light">

                    <path fill="none" stroke="#D6A23B" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" d="M 42.5 20 C 57.5 10, 77.5 20, 77.5 35 C 92.5 45, 87.5 70, 72.5 75 C 62.5 90, 32.5 90, 22.5 75 C 7.5 70, 7.5 45, 17.5 35 C 17.5 20, 37.5 10, 42.5 20 Z" transform="translate(50,50) scale(0.86) translate(-50,-50)" />
                </svg>
                <span class="fs-4" style="letter-spacing: -0.5px;">
                    <span style="color: #198754; font-weight: 700;">Sabor</span><span style="color: #212529; font-weight: 400;">itm</span>

            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2">

                            <li><hr class="dropdown-divider"></li>

                        <i class="bi bi-magic fs-5"></i> <span>¿Qué cocino hoy?</span>
                    </a>
                    <button id="btn-auth-session" class="btn btn-outline-success border-2 rounded-pill px-4 py-2 d-flex align-items-center justify-content-center gap-2">

    <div class="admin-header py-4 bg-white border-bottom mb-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
            <div class="text-center text-md-start">
                <h1 class="h2 fw-bold text-dark mb-1">Ingredientes</h1>
                <p class="text-muted mb-0">Gestiona la despensa de tus recetas</p>
            </div>
            <div class="d-flex gap-2 w-100 w-md-auto">
                <div class="input-group" style="max-width: 300px;">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-success"></i></span>
                    <input type="text" id="searchIngrediente" class="form-control form-control-premium border-start-0" placeholder="Buscar ingrediente...">
                </div>
                <button class="btn btn-premium btn-premium-success shadow-sm solo-admin d-none" data-bs-toggle="modal" data-bs-target="#ingredienteModal">
                    <i class="bi bi-plus-circle"></i> <span>Nuevo</span>
                </button>
            </div>
        </div>
    </div>

    <div class="container mb-5 animate-fade-in">
        <div class="card card-premium overflow-hidden border-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4 py-3 text-secondary small fw-bold text-uppercase">Nombre del Ingrediente</th>
                            <th class="text-end pe-4 py-3 text-secondary small fw-bold text-uppercase solo-admin d-none">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="ingredientes-tbody" class="border-top-0">
                        <tr><td colspan="2" class="text-center text-muted py-5">Cargando ingredientes...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="ingredienteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="ingredienteForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Guardar Ingrediente</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" for="nombreIngrediente">Nombre</label>
                            <input type="text" class="form-control" id="nombreIngrediente" name="nombre" placeholder="Ej: Harina" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Navbar scroll effect
            window.addEventListener('scroll', () => {
                const nav = document.querySelector('.navbar-custom');
                if (window.scrollY > 50) nav.classList.add('scrolled');
                else nav.classList.remove('scrolled');
            });

            const tbody = document.getElementById('ingredientes-tbody');
            const form = document.getElementById('ingredienteForm');
            const searchInput = document.getElementById('searchIngrediente');
            const modalEl = document.getElementById('ingredienteModal');
            let bootstrapModal = null;
            if(window.bootstrap) bootstrapModal = new bootstrap.Modal(modalEl);

            let todosLosIngredientes = [];
            const normalizar = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();

            const renderizarIngredientes = (ingredientes) => {
                if (!ingredientes || ingredientes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="2" class="text-center py-4 text-muted">No se encontraron ingredientes.</td></tr>';
                    return;
                }
                
                let html = '';
                ingredientes.forEach(ing => {
                    html += `
                        <tr>
                            <td class="ps-4 align-middle">${ing.nombre}</td>
                            <td class="text-end pe-4 align-middle solo-admin d-none">
                                <button class="btn btn-sm btn-outline-danger btn-delete solo-admin d-none" data-id="${ing.idIngrediente}">
                                    <i class="bi bi-trash me-1"></i> Eliminar
                                </button>
                            </td>
                        </tr>`;
                });
                tbody.innerHTML = html;

                document.querySelectorAll('.btn-delete').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const target = e.currentTarget;
                        const result = await Swal.fire({
                            title: '¿Estás seguro?',
                            text: "Este ingrediente se quitará de las recetas que lo usen.",
                            icon: 'warning',
                            showCancelButton: true,
                            confirmButtonColor: '#198754',
                            confirmButtonText: 'Sí, eliminar'
                        });

                        if (result.isConfirmed) {
                            const id = parseInt(target.getAttribute('data-id'));
                            const success = await api.delete(`/ingredientes/${id}`);
                            if (success) {
                                Swal.fire({ title: '¡Eliminado!', icon: 'success', timer: 1000, showConfirmButton: false });
                                cargarIngredientes();
                            }
                        }
                    });
                });
                
                if (typeof actualizarInterfazAuth === 'function') {
                    actualizarInterfazAuth();
                }
            };

            const cargarIngredientes = async () => {
                todosLosIngredientes = await api.get('/ingredientes') || [];
                aplicarFiltro();
            };

            const aplicarFiltro = () => {
                const term = normalizar(searchInput.value);
                const filtrados = todosLosIngredientes.filter(i => normalizar(i.nombre).includes(term));
                renderizarIngredientes(filtrados);
            };

            searchInput.addEventListener('input', aplicarFiltro);

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const nombre = document.getElementById('nombreIngrediente').value;
                const btnSubmit = form.querySelector('button[type="submit"]');

                if(nombre) {
                    btnSubmit.disabled = true;
                    btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Guardando...';
                    const res = await api.post('/ingredientes', { nombre });
                    if (res) {
                        Swal.fire({ title: '¡Guardado!', icon: 'success', timer: 1000, showConfirmButton: false });
                        form.reset();
                        if(bootstrapModal) bootstrapModal.hide();
                        cargarIngredientes();
                    }
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = 'Guardar';
                }
            });

            await cargarIngredientes();
        });
    </script>
</body>
</html>
