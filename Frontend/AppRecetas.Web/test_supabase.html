<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba de Conexión - Saboritm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
    <div class="container" style="max-width: 600px;">
        <h2 class="mb-4">Prueba de Conexión Supabase + .NET</h2>
        
        <div class="card p-4 shadow-sm">
            <h5>1. Estado de Autenticación</h5>
            <div id="authStatus" class="alert alert-info">Verificando...</div>
            
            <hr>
            
            <h5>2. Subida de Imagen (Prueba de Storage)</h5>
            <p class="small text-muted">Selecciona una imagen para probar la subida al bucket 'recetas' y la respuesta de la API.</p>
            <input type="file" id="testFile" class="form-control mb-3" accept="image/*">
            <button id="btnTest" class="btn btn-primary w-100">Probar Subida</button>
            
            <div id="result" class="mt-4 d-none">
                <h6>Resultado:</h6>
                <div id="resultContent" class="p-3 bg-light border rounded small" style="white-space: pre-wrap;"></div>
                <img id="resultImg" class="mt-3 rounded shadow-sm w-100 d-none">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.42.0/dist/umd/supabase.js"></script>
    <script src="js/api.js"></script>
    <script>
        const authStatus = document.getElementById('authStatus');
        const btnTest = document.getElementById('btnTest');
        const result = document.getElementById('result');
        const resultContent = document.getElementById('resultContent');
        const resultImg = document.getElementById('resultImg');

        async function checkStatus() {
            if (!window.supabaseClient) {
                authStatus.className = 'alert alert-danger';
                authStatus.innerHTML = 'Error: No se encontró el cliente de Supabase.';
                return;
            }
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (session) {
                authStatus.className = 'alert alert-success';
                authStatus.innerHTML = `✓ Sesión activa: <strong>${session.user.email}</strong>`;
            } else {
                authStatus.className = 'alert alert-warning';
                authStatus.innerHTML = '⚠ No estás logueado. <a href="login.html">Ir al login</a>';
                btnTest.disabled = true;
            }
        }

        btnTest.onclick = async () => {
            const fileInp = document.getElementById('testFile');
            if (fileInp.files.length === 0) return alert('Selecciona un archivo');

            btnTest.disabled = true;
            btnTest.innerHTML = 'Procesando...';
            result.classList.add('d-none');
            resultImg.classList.add('d-none');

            try {
                const file = fileInp.files[0];
                const formData = new FormData();
                formData.append('file', file);

                // Llamada a la API de .NET (que a su vez subirá a Supabase si no es Dev)
                const response = await fetch(`${API_BASE_URL}/Uploads/image`, {
                    method: 'POST',
                    headers: await getHeaders({}),
                    body: formData
                });

                const data = await response.json();
                
                result.classList.remove('d-none');
                resultContent.textContent = JSON.stringify(data, null, 2);
                
                if (response.ok && data.url) {
                    resultImg.src = resolveImgUrl(data.url);
                    resultImg.classList.remove('d-none');
                }
            } catch (err) {
                result.classList.remove('d-none');
                resultContent.textContent = 'Error: ' + err.message;
            } finally {
                btnTest.disabled = false;
                btnTest.innerHTML = 'Probar Subida';
            }
        };

        checkStatus();
    </script>
</body>
</html>
