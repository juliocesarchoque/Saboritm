<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Receta - Saboritm</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='14' fill='%23D6A23B' /%3E%3Cpath fill='none' stroke='%23D6A23B' stroke-width='2' stroke-linejoin='round' stroke-linecap='round' d='M 42.5 20 C 57.5 10, 77.5 20, 77.5 35 C 92.5 45, 87.5 70, 72.5 75 C 62.5 90, 32.5 90, 22.5 75 C 7.5 70, 7.5 45, 17.5 35 C 17.5 20, 37.5 10, 42.5 20 Z' /%3E%3Cpath fill='none' stroke='%23D6A23B' stroke-width='2.3' stroke-linejoin='round' stroke-linecap='round' d='M 42.5 20 C 57.5 10, 77.5 20, 77.5 35 C 92.5 45, 87.5 70, 72.5 75 C 62.5 90, 32.5 90, 22.5 75 C 7.5 70, 7.5 45, 17.5 35 C 17.5 20, 37.5 10, 42.5 20 Z' transform='translate(50,50) scale(0.86) translate(-50,-50)' /%3E%3C/svg%3E">
    <meta name="theme-color" content="#198754">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .form-container {
            background: #fff;
            padding: 2.5rem;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }
        .step-textarea { border-radius: 15px; }
        .ing-header-row { display: flex; gap: 6px; padding: 0 4px; margin-bottom: 4px; }
        .ing-header-row span { font-size: 0.68rem; font-weight: 700; color: #888; text-transform: uppercase; }
        .ing-header-row .lbl-ing  { flex: 0 0 42%; }
        .ing-header-row .lbl-cant { flex: 0 0 18%; }
        .ing-header-row .lbl-unit { flex: 0 0 28%; }
        .ing-header-row .lbl-del  { flex: 0 0 10%; }
        
        @media (max-width: 576px) {
            .ing-header-row { display: none; }
            .form-container { padding: 1.5rem; border-radius: 20px; }
        }
    </style>
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top navbar-custom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="34" height="34" style="overflow: visible;">
                    <circle cx="50" cy="50" r="14" fill="#D6A23B" />
                    <path fill="none" stroke="#D6A23B" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" d="M 42.5 20 C 57.5 10, 77.5 20, 77.5 35 C 92.5 45, 87.5 70, 72.5 75 C 62.5 90, 32.5 90, 22.5 75 C 7.5 70, 7.5 45, 17.5 35 C 17.5 20, 37.5 10, 42.5 20 Z" />
                    <path fill="none" stroke="#D6A23B" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" d="M 42.5 20 C 57.5 10, 77.5 20, 77.5 35 C 92.5 45, 87.5 70, 72.5 75 C 62.5 90, 32.5 90, 22.5 75 C 7.5 70, 7.5 45, 17.5 35 C 17.5 20, 37.5 10, 42.5 20 Z" transform="translate(50,50) scale(0.86) translate(-50,-50)" />
                </svg>
                <span class="fs-4" style="letter-spacing: -0.5px;">
                    <span style="color: #198754; font-weight: 700;">Sabor</span><span style="color: #212529; font-weight: 400;">itm</span>
                </span>
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2">
                    <li class="nav-item"><a class="nav-link nav-link-custom" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-custom" href="recetas.html">Recetas</a></li>
                </ul>
                <div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-3 mt-3 mt-lg-0 pb-3 pb-lg-0">
                    <a href="sugerencias_cocina.html" class="btn btn-premium btn-premium-success shadow justify-content-center">
                        <i class="bi bi-magic fs-5"></i> <span>¿Qué cocino hoy?</span>
                    </a>
                    <button id="btn-auth-session" class="btn btn-outline-success border-2 rounded-pill px-4 py-2 d-flex align-items-center justify-content-center gap-2" title="Admin">
                        <i class="bi bi-person-fill fs-4"></i> Admin
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="form-container">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="fw-bold mb-0" id="formTitle">Registrar Receta</h2>
                        <a href="recetas.html" class="btn btn-light rounded-pill"><i class="bi bi-x-lg"></i></a>
                    </div>

                    <form id="recetaForm">
                        <div class="row g-4">
                            <!-- Basic Info -->
                            <div class="col-md-8">
                                <label class="form-label fw-bold">Nombre de la Receta</label>
                                <input type="text" class="form-control form-control-premium" id="nombreReceta" required placeholder="Ej: Majadito de Charque">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Categoría</label>
                                <select class="form-select form-control-premium" id="categoriaReceta" required>
                                    <option value="">Seleccionar...</option>
                                </select>
                            </div>

                            <!-- Image -->
                            <div class="col-12">
                                <label class="form-label fw-bold">Fotografía</label>
                                <div class="d-flex gap-3 align-items-center">
                                    <div id="imagePreviewContainer" style="width: 100px; height: 100px; border-radius: 15px; overflow: hidden; background: #f0f0f0; cursor: pointer; position: relative;" class="flex-shrink-0" onclick="document.getElementById('imagenRecetaInput').click()" title="Haz clic para cambiar la imagen">
                                        <img id="imagePreview" src="assets/no-food.png" style="width: 100%; height: 100%; object-fit: cover; transition: 0.3s;">
                                        <div class="position-absolute w-100 h-100 d-flex align-items-center justify-content-center" style="top:0; left:0; background: rgba(0,0,0,0.4); opacity: 0; transition: 0.3s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0'">
                                            <i class="bi bi-camera text-white fs-3"></i>
                                        </div>
                                    </div>
                                    <div class="flex-grow-1">
                                        <label class="form-label fw-semibold mb-1">Haz clic en la imagen para cambiarla</label>
                                        <p id="imageStatusLabel" class="text-muted small mb-0">Ninguna imagen seleccionada</p>
                                        <input type="file" class="d-none" id="imagenRecetaInput" accept="image/*">
                                    </div>
                                </div>
                            </div>

                            <!-- Steps -->
                            <div class="col-12">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <label class="form-label fw-bold mb-0">Pasos de Preparación</label>
                                    <button type="button" onclick="agregarPasoInstruccion()" class="btn btn-sm btn-outline-success rounded-pill">
                                        <i class="bi bi-plus-circle me-1"></i> Añadir Paso
                                    </button>
                                </div>
                                <div id="pasosInstruccionesContainer" class="p-3 border rounded-4 bg-light"></div>
                            </div>

                            <!-- Ingredients -->
                            <div class="col-12">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <label class="form-label fw-bold mb-0">Ingredientes</label>
                                    <button type="button" id="btnAgregarIngrediente" class="btn btn-sm btn-outline-success rounded-pill">
                                        <i class="bi bi-plus-circle me-1"></i> Añadir Ingrediente
                                    </button>
                                </div>
                                <div class="p-3 border rounded-4 bg-light">
                                    <div class="ing-header-row mb-2">
                                        <span class="lbl-ing">INGREDIENTE</span>
                                        <span class="lbl-cant">CANT.</span>
                                        <span class="lbl-unit">UNIDAD</span>
                                        <span class="lbl-del"></span>
                                    </div>
                                    <div id="ingredientesContainer"></div>
                                </div>
                            </div>

                            <div class="col-12 text-end mt-5">
                                <hr class="mb-4">
                                <button type="button" onclick="window.history.back()" class="btn btn-light rounded-pill px-4 me-2">Cancelar</button>
                                <button type="button" id="btnSubmit" class="btn btn-premium btn-premium-success px-5 py-3" onclick="handleSubmit(event)">Guardar Receta</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.42.0/dist/umd/supabase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/api.js"></script>
    <script>
        const DEFAULT_NO_FOOD = 'assets/no-food.png';
        const urlParams = new URLSearchParams(window.location.search);
        const recetaId = urlParams.get('id');
        let ingredientesDB = [];
        let tagifyInstances = {};
        let currentImgUrl = DEFAULT_NO_FOOD; // URL final que se guarda en BD
        let pendingImageFile = null;          // Archivo seleccionado pendiente de subir al guardar

        const UNIDADES = [
            { v: '', l: '(Sin unidad)' },
            { v: 'g', l: 'g' }, { v: 'kg', l: 'kg' }, { v: 'ml', l: 'ml' }, { v: 'l', l: 'l' },
            { v: 'taza', l: 'Taza(s)' }, { v: 'cda', l: 'Cda(s)' }, { v: 'cdta', l: 'Cdta(s)' },
            { v: 'unidad', l: 'Unid.' }, { v: 'diente', l: 'Diente(s)' }, { v: 'ramita', l: 'Ramita(s)' }
        ];

        document.addEventListener('DOMContentLoaded', async () => {
            // Verificar sesión primero
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.replace('login.html');
                return;
            }

            // Iniciamos todas las cargas en paralelo para máxima velocidad
            const promises = [
                loadCategorias(),
                loadIngredientes()
            ];
            
            if (recetaId) {
                document.getElementById('formTitle').textContent = 'Editar Receta';
                document.getElementById('btnSubmit').textContent = 'Actualizar Cambios';
                promises.push(api.get(`/recetas/${recetaId}`));
            }

            const results = await Promise.all(promises);
            const recipeData = recetaId ? results[2] : null;

            if (recetaId) {
                if (recipeData) {
                    await poblarFormulario(recipeData);
                } else {
                    Swal.fire('Error', 'No se pudo cargar la receta', 'error');
                }
            } else {
                agregarPasoInstruccion();
                agregarFilaIngrediente();
            }

            document.getElementById('btnAgregarIngrediente').addEventListener('click', () => agregarFilaIngrediente());
            document.getElementById('imagenRecetaInput').addEventListener('change', handleImagePreview);
        });

        async function loadCategorias() {
            const select = document.getElementById('categoriaReceta');
            const categorias = await api.get('/categorias');
            if (categorias) {
                categorias.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.idCategoria;
                    opt.textContent = c.nombre;
                    select.appendChild(opt);
                });
            }
            return categorias;
        }

        let whitelistCached = null;
        async function loadIngredientes() {
            ingredientesDB = await api.get('/ingredientes') || [];
            whitelistCached = ingredientesDB.map(i => ({ value: i.nombre, id: i.idIngrediente }));
            return ingredientesDB;
        }

        async function poblarFormulario(r) {
            document.getElementById('nombreReceta').value = r.nombre;
            document.getElementById('categoriaReceta').value = r.idCategoria;
            if (r.imagenUrl) {
                currentImgUrl = r.imagenUrl;
                document.getElementById('imagePreview').src = resolveImgUrl(r.imagenUrl) || DEFAULT_NO_FOOD;
            }

            // Pasos
            const pasos = r.instrucciones ? r.instrucciones.split('\n') : [];
            const containerPasos = document.getElementById('pasosInstruccionesContainer');
            containerPasos.innerHTML = ''; // Limpiar
            
            pasos.forEach(p => { if(p.trim()) agregarPasoInstruccion(p.trim()); });
            if (pasos.length === 0) agregarPasoInstruccion();

            // Ingredientes
            const containerIng = document.getElementById('ingredientesContainer');
            containerIng.innerHTML = ''; // Limpiar

            if (r.recetaIngredientes && r.recetaIngredientes.length > 0) {
                r.recetaIngredientes.forEach(ri => {
                    agregarFilaIngrediente(ri.idIngrediente, ri.nombre, ri.cantidad);
                });
            } else {
                agregarFilaIngrediente();
            }
        }

        function agregarPasoInstruccion(valor = '') {
            const container = document.getElementById('pasosInstruccionesContainer');
            const stepId = 'step-' + Date.now();
            const count = container.querySelectorAll('.step-row').length + 1;

            const html = `
                <div class="d-flex gap-3 mb-3 step-row animate-fade-in" id="${stepId}">
                    <div class="fw-bold text-success pt-2" style="min-width:25px;">${count}.</div>
                    <textarea class="form-control form-control-premium step-textarea" rows="2" placeholder="Describe este paso...">${valor}</textarea>
                    <button type="button" class="btn btn-sm btn-outline-danger border-0 h-50 align-self-center" onclick="this.closest('.step-row').remove(); reenumerarPasos();">
                        <i class="bi bi-trash fs-5"></i>
                    </button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        }

        function reenumerarPasos() {
            document.querySelectorAll('.step-row').forEach((row, idx) => {
                row.querySelector('.fw-bold').textContent = (idx + 1) + '.';
            });
        }

        function agregarFilaIngrediente(idIng = null, nombreIng = '', cantStr = '') {
            const container = document.getElementById('ingredientesContainer');
            const rowId = 'ing-row-' + Date.now() + Math.random().toString(36).substr(2, 5);
            
            let num = cantStr || '';
            let unit = '';
            
            if (cantStr) {
                const parts = cantStr.match(/^([\d.,/]+)\s*(.*)$/);
                if (parts) {
                    const parsedUnit = parts[2].trim().toLowerCase();
                    const unidadExiste = UNIDADES.some(u => u.v === parsedUnit);
                    if (unidadExiste || parsedUnit === '') {
                        num = parts[1];
                        unit = parsedUnit;
                    }
                }
            }

            const html = `
                <div class="row g-2 mb-2 ing-item animate-fade-in border-bottom pb-2" id="${rowId}">
                    <div class="col-12 col-md-5">
                        <input class="form-control form-control-premium tagify-ing" placeholder="Buscar ingrediente..." value="${nombreIng}">
                    </div>
                    <div class="col-5 col-md-2">
                        <input type="text" class="form-control form-control-premium ing-num" placeholder="Cant." value="${num}" required>
                    </div>
                    <div class="col-5 col-md-3">
                        <select class="form-select form-control-premium ing-unit">
                            ${UNIDADES.map(u => `<option value="${u.v}" ${unit === u.v ? 'selected' : ''}>${u.l}</option>`).join('')}
                        </select>
                    </div>
                    <div class="col-2 col-md-2 text-end">
                        <button type="button" class="btn btn-outline-danger border-0" onclick="document.getElementById('${rowId}').remove(); delete tagifyInstances['${rowId}'];">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);

            const input = container.querySelector(`#${rowId} .tagify-ing`);
            const t = new Tagify(input, {
                whitelist: whitelistCached || [],
                enforceWhitelist: true,
                mode: "select",
                dropdown: { enabled: 0, closeOnSelect: true }
            });
            tagifyInstances[rowId] = t;
        }

        // Solo muestra la vista previa localmente. La subida real ocurre al guardar.
        function handleImagePreview(e) {
            const file = e.target.files[0];
            if (!file) return;

            pendingImageFile = file; // Guardar el archivo en memoria para subirlo al guardar

            const img = document.getElementById('imagePreview');
            const label = document.getElementById('imageStatusLabel');
            const reader = new FileReader();
            reader.onload = (ev) => {
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
            label.textContent = `✓ Lista para guardar: ${file.name}`;
            label.className = 'text-success small mb-0 fw-semibold';
        }

        let isSubmitting = false; // Guard para evitar doble envío

        async function handleSubmit(e) {
            e.preventDefault();

            if (isSubmitting) return; // Ignorar clicks extra mientras se procesa

            const form = document.getElementById('recetaForm');
            if (!form.reportValidity()) {
                return;
            }

            isSubmitting = true;
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;

            try {
                // PASO 1: Si hay una imagen pendiente, subirla AHORA (solo una vez, al guardar)
                if (pendingImageFile) {
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Subiendo imagen...';
                    const formData = new FormData();
                    formData.append('file', pendingImageFile);
                    const uploadRes = await fetch(`${API_BASE_URL}/Uploads/image`, { 
                        method: 'POST', 
                        headers: await getHeaders({}, false), // No incluir Content-Type para FormData
                        body: formData 
                    });
                    if (uploadRes.ok) {
                        const uploadData = await uploadRes.json();
                        currentImgUrl = uploadData.url;
                        pendingImageFile = null;
                    } else {
                        const errData = await uploadRes.json();
                        Swal.fire('Error al subir imagen', errData.message || 'Error desconocido', 'error');
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                        return;
                    }
                }

                // PASO 2: Guardar la receta con la URL de imagen correcta
                btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Guardando cambios...';

                const ingredientes = [];
                document.querySelectorAll('.ing-item').forEach(el => {
                    const rowId = el.id;
                    const t = tagifyInstances[rowId];
                    if (t && t.value[0]) {
                        const id = t.value[0].id;
                        const num = el.querySelector('.ing-num').value.trim();
                        const unit = el.querySelector('.ing-unit').value;
                        const combined = unit ? `${num} ${unit}` : num;
                        ingredientes.push({ idIngrediente: parseInt(id), cantidad: combined });
                    }
                });

                const payload = {
                    idReceta: recetaId ? parseInt(recetaId) : 0,
                    nombre: document.getElementById('nombreReceta').value,
                    idCategoria: parseInt(document.getElementById('categoriaReceta').value),
                    instrucciones: Array.from(document.querySelectorAll('.step-textarea')).map(ta => ta.value.trim()).filter(v => v).join('\n'),
                    imagenUrl: currentImgUrl,
                    tiempoPreparacion: 30,
                    recetaIngredientes: ingredientes
                };

                let response;
                if (recetaId) {
                    response = await fetch(`${API_BASE_URL}/recetas/${recetaId}`, {
                        method: 'PUT',
                        headers: await getHeaders(),
                        body: JSON.stringify(payload)
                    });
                } else {
                    response = await fetch(`${API_BASE_URL}/recetas`, {
                        method: 'POST',
                        headers: await getHeaders(),
                        body: JSON.stringify(payload)
                    });
                }
                if (response.ok) {
                    await Swal.fire({
                        title: '¡Éxito!',
                        text: recetaId ? 'Cambios guardados correctamente' : 'Receta registrada correctamente',
                        icon: 'success',
                        timer: 1500,
                        showConfirmButton: false
                    });
                    window.location.replace('index.html');
                    return;
                } else {
                    const error = await response.json().catch(() => ({ message: 'Error desconocido en el servidor' }));
                    Swal.fire('Error', error.message || 'No se pudo guardar la receta', 'error');
                }            } catch (err) {
                console.error(err);
                Swal.fire('Error', 'Ocurrió un error inesperado al conectar con la API', 'error');
            } finally {
                // Solo rehabilitar si hubo error (si la navegación tuvo éxito ya salimos con return)
                isSubmitting = false;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
